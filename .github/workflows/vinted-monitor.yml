name: Surveillance iPhone Vinted
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iphone-vinted-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Vérifier les secrets
        env:
          VINTED_SEARCH_URL: ${{ secrets.VINTED_SEARCH_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$VINTED_SEARCH_URL" && echo "Vinted URL reçue" || echo "Vinted URL absente"
          test -n "$DISCORD_WEBHOOK_URL" && echo "Webhook reçu" || echo "Webhook absent"

      - name: Chercher les nouvelles annonces
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VINTED_SEARCH_URL: ${{ secrets.VINTED_SEARCH_URL }}
          MIN_MARGIN_EUR: "80"
          MAX_ITEMS_PER_RUN: "96"
        run: python src/main.py
      
      - name: Chercher les nouvelles annonces
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VINTED_SEARCH_URL: ${{ secrets.VINTED_SEARCH_URL }}
          MIN_MARGIN_EUR: "80"
          MAX_ITEMS_PER_RUN: "96"
        run: python src/main.py
      - name: Sauvegarder l’historique
        run: |
          if git diff --quiet -- data/seen_items.json; then exit 0; fi
          git config user.name "iphone-deals-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_items.json
          git commit -m "chore: update seen Vinted items"
          git push
